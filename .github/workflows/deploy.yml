name: Desplegar en IIS Local

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Compilar proyecto .NET
        run: dotnet publish -c Release -o ./publish

      - name: Copiar archivos compilados a IIS
        run: xcopy /E /I /Y ".\publish\*" "C:\inetpub\wwwroot\DAS901"
